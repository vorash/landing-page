<?xml version="1.0" encoding="UTF-8"?>
<!-- Vora app icon: a V woven through an envelope (over it on the left, under it on the right).
     Hand-made, see assets/icons/README.md. apps/vora/src/tray.rs draws the same mark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1e2c"/>
      <stop offset="1" stop-color="#0e0f16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a4fb0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a4fb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vee" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#c08cff"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a63c8"/>
      <stop offset="1" stop-color="#7d5fc4"/>
    </linearGradient>
    <!-- The weave: a gap in the envelope where the V passes over it (left), and in the V where it
         passes under the envelope's top edge (right). -->
    <mask id="under-v" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <polyline points="20,30 64,84" fill="none" stroke="#000" stroke-width="19" stroke-linecap="round"/>
    </mask>
    <mask id="under-envelope" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M72,50 H97 A9,9 0 0 1 106,59 V72" fill="none" stroke="#000" stroke-width="14"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#plate)"/>
  <circle cx="64" cy="66" r="52" fill="url(#glow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <rect x="22" y="50" width="84" height="50" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="url(#envelope)" stroke-width="6" mask="url(#under-v)"/>
  <polyline points="20,30 64,84 108,30" fill="none" stroke="url(#vee)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" mask="url(#under-envelope)"/>
</svg>
