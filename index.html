    <meta name="title" content="Vora — A clean room for dirty code." />
    <meta name="description" content="Vora is an open-source runtime that runs AI agents, generated scripts and untrusted PRs in isolated Linux sandboxes — default-deny networking, credentials the agent never sees, and a record of every exec and every network decision. One Go binary. No Kubernetes." />

    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Paint the saved theme's background before React mounts, so night
         visitors don't get a white flash. Keep the key in sync with CleanRoom.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vora-cr-theme");
          if (t !== "day" && t !== "night") t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
          document.documentElement.style.background = t === "night" ? "#0a0b0f" : "#f6f6f3";
        } catch (e) {}
      })();
    </script>
