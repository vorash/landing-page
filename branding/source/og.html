<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Switzer"; src: url("../../src/landing/fonts/switzer-variable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: "Switzer"; src: url("../../src/landing/fonts/switzer-variable-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: "Fragment Mono"; src: url("../../src/landing/fonts/fragment-mono-latin.woff2") format("woff2"); }

  :root {
    --bg: #f6f6f3; --ink: #0d0e12; --muted: #585b63; --line: rgba(13,14,18,.06); --chip: #fff; --chip-line: #e3e3de;
    --deny: #d93a3f; --glass: rgba(255,255,255,.55); --edge-a: #9ee7ff; --edge-b: #c5b8ff; --edge-c: #ffc4e6; --orb: #2b59ff;
    --glow: rgba(197,184,255,.35); --glow2: rgba(158,231,255,.28);
  }
  body.night {
    --bg: #0a0b0f; --ink: #eceef3; --muted: #9a9ea8; --line: rgba(236,238,243,.05); --chip: #12141a; --chip-line: #2b2f38;
    --deny: #ff6b6f; --glass: rgba(20,22,29,.55); --orb: #7d98ff; --glow: rgba(125,152,255,.22); --glow2: rgba(185,156,255,.14);
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Switzer", sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; }
  .grid { position: absolute; inset: 0;
    background: linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 40px 40px;
    -webkit-mask-image: radial-gradient(ellipse 80% 90% at 70% 50%, #000 30%, transparent 85%); }
  .glow { position: absolute; right: -80px; top: 40px; width: 720px; height: 560px;
    background: radial-gradient(closest-side, var(--glow), transparent 70%), radial-gradient(closest-side at 70% 70%, var(--glow2), transparent 70%); }
  .logo { position: relative; display: flex; align-items: center; gap: 10px; }
  .logo img { height: 44px; }
  .pill { position: relative; display: inline-flex; align-items: center; gap: 10px; margin-top: 52px; padding: 9px 16px; border-radius: 999px;
    font-family: "Fragment Mono", monospace; font-size: 17px; letter-spacing: .08em; background: var(--chip);
    border: 1.5px solid transparent; background-clip: padding-box; box-shadow: 0 0 0 1.5px var(--edge-b); }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--orb); }
  h1 { position: relative; margin-top: 26px; font-weight: 600; font-size: 104px; line-height: .95; letter-spacing: -.055em; }
  h1 em { display: block; font-style: italic; font-weight: 400; letter-spacing: -.05em; }
  h1 u { text-decoration: underline wavy var(--deny); text-decoration-thickness: 3px; text-underline-offset: 12px; }
  .sub { position: relative; margin-top: 30px; max-width: 560px; font-size: 25px; line-height: 1.35; color: var(--muted); }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 50px; display: flex; justify-content: space-between;
    font-family: "Fragment Mono", monospace; font-size: 16px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .foot b { color: var(--ink); font-weight: 400; }
  .cube { position: absolute; right: 70px; top: 120px; width: 400px; height: 400px; }
  .chip { position: absolute; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px; background: var(--chip);
    border: 1px solid var(--chip-line); font-family: "Fragment Mono", monospace; font-size: 15px; color: var(--ink);
    box-shadow: 0 10px 24px -14px rgba(0,0,0,.35); }
  .chip span { color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
  .chip.bad { border-color: color-mix(in srgb, var(--deny) 45%, transparent); }
  .chip.bad i { width: 8px; height: 8px; border-radius: 50%; background: var(--deny); }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="logo"><img id="logo" src="../svg/vora-logo.svg" alt="vora" /></div>
  <div class="pill"><i></i>DEFAULT DENY. TOTAL RECALL.</div>
  <h1>A clean room<em>for <u>dirty</u> code.</em></h1>
  <p class="sub">Isolated Linux sandboxes for AI agents and untrusted code.</p>

  <svg class="cube" viewBox="0 0 400 400" fill="none">
    <defs>
      <linearGradient id="e1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--edge-a)"/><stop offset=".5" stop-color="var(--edge-b)"/><stop offset="1" stop-color="var(--edge-c)"/></linearGradient>
      <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
      <radialGradient id="orb" cx=".35" cy=".3" r=".75"><stop stop-color="#fff"/><stop offset=".3" stop-color="#b8c8ff"/><stop offset=".7" stop-color="var(--orb)"/><stop offset="1" stop-color="#5b3df0"/></radialGradient>
      <radialGradient id="orbglow" cx=".5" cy=".5" r=".5"><stop stop-color="var(--orb)" stop-opacity=".45"/><stop offset="1" stop-color="var(--orb)" stop-opacity="0"/></radialGradient>
      <radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse cx="200" cy="362" rx="170" ry="26" fill="url(#floor)"/>
    <path d="M200 40 L350 115 V285 L200 360 L50 285 V115 Z" fill="var(--glass)"/>
    <path d="M50 115 L200 190 L350 115 L200 40 Z" fill="url(#face)" opacity=".7"/>
    <path d="M200 190 V360" stroke="url(#e1)" stroke-width="2" opacity=".55"/>
    <path d="M50 115 L200 190 L350 115" stroke="url(#e1)" stroke-width="2.5"/>
    <path d="M200 40 L350 115 V285 L200 360 L50 285 V115 Z" stroke="url(#e1)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="190" cy="235" r="70" fill="url(#orbglow)"/>
    <circle cx="190" cy="235" r="26" fill="url(#orb)"/>
    <path d="M262 212 L338 196" stroke="var(--deny)" stroke-width="1.5" stroke-dasharray="3 4"/>
  </svg>
  <div class="chip" style="right: 64px; top: 120px"><span>network</span>none</div>
  <div class="chip bad" style="right: 18px; top: 292px"><i></i>egress denied</div>
  <div class="chip" style="right: 360px; top: 470px"><span>audit</span>on</div>

  <div class="foot"><span>Open source · MIT · One Go binary · No Kubernetes</span><b>vora.sh</b></div>
</div>
<script>
  // ?night renders the dark card.
  if (location.search.includes("night")) {
    document.body.classList.add("night");
    document.getElementById("logo").src = "../svg/vora-logo-night.svg";
  }
</script>
</body>
</html>
